<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f351d"><title>Nuvabri — test saisonnier</title><style>html,body{margin:0;min-height:100%;background:#f7eee4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#3b291f}#load{padding:28px;text-align:center}b{color:#a94724}</style></head><body><div id="load"><b>Nuvabri</b><br>Chargement du thème automne…</div><script>fetch('/?fresh=season-'+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(h=>{h=h.replace('<body>','<body data-season="autumn">').replace(':root{--b:#356f68;--bg:#f4f6f1;--txt:#20332f;--mut:#6e7d77;--card:#fffefa;--soft:#e8f0eb;--s1:#edf4ef;--s2:#fffaf0;--hero1:#356f68;--hero2:#4f877e;--heroText:#fff;--accent:#d8a765;--navbg:#fffefa;--navborder:#dbe3de;--day:#fff;',':root{--b:#a94724;--bg:#f7eee4;--txt:#3b291f;--mut:#806858;--card:#fffaf3;--soft:#f2ddc9;--s1:#f7d9bd;--s2:#fff2df;--hero1:#8f351d;--hero2:#c46a2f;--heroText:#fffaf3;--accent:#e3a24f;--navbg:#fff8ef;--navborder:#ecd4bf;--day:#fffdf8;');document.open();document.write(h);document.close()}).catch(e=>document.getElementById('load').innerHTML='Erreur de chargement : '+e.message)</script></body></html>
